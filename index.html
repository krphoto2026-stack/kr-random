<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KR Random – สุ่มชื่อนักเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#060a18;--panel:#0e1530;--panel2:#141d40;--line:#24326a;--txt:#e9edff;--mut:#8f99cc;--acc:#00e1ff;--gold:#ffd54a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Kanit','Leelawadee UI','Tahoma',system-ui,sans-serif;background:radial-gradient(ellipse at 50% -10%,#1d2f7a 0%,#060a18 55%) fixed,#060a18;color:var(--txt);min-height:100vh}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.ic{width:1em;height:1em;vertical-align:-.14em;flex:none;display:inline-block}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px;background:rgba(6,10,24,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{margin-right:auto;font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px}
.logo .ic{color:var(--acc);font-size:26px;filter:drop-shadow(0 0 8px rgba(0,225,255,.6))}
.logo span{background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer;transition:.2s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn .ic,.seg .ic{margin-right:.45em}
.btn .ic.m0{margin:0}
.btn:hover{border-color:var(--acc);box-shadow:0 0 12px rgba(0,225,255,.3)}
.btn.gold{background:linear-gradient(135deg,#ffe27a,#d49b00);color:#2a1a00;border:none;font-weight:800}
.btn.danger{border-color:#7a2a3a;color:#ff8da1}
.btn.sm{padding:5px 10px;font-size:13px}
.layout{display:grid;grid-template-columns:350px 1fr;gap:20px;padding:20px;max-width:1400px;margin:0 auto}
@media(max-width:920px){.layout{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.box h3{font-size:16px;margin-bottom:12px}
.box h3 .hi{color:var(--acc);margin-right:8px}
.field{margin-bottom:12px}
.lbl{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
select,input[type=number]{width:100%;background:#0a1026;border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none}
select:focus,input:focus{border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#0a1026;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:none;padding:7px 4px;border-radius:8px;cursor:pointer;color:var(--mut);display:flex;align-items:center;justify-content:center}
.seg button.on{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;font-weight:600}
.stepper{display:flex;gap:6px}
.stepper button{width:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.stepper input{text-align:center}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--mut)}
.stat b{color:var(--txt)}
.c-m{color:#4db8ff}.c-f{color:#ff7ab8}
.file-drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:10px}
.file-drop:hover,.file-drop.drag{border-color:var(--acc);background:rgba(0,225,255,.06)}
.file-drop .big-ic{font-size:38px;color:#21c47a;margin-bottom:4px}
.btn-row{display:flex;flex-wrap:wrap;gap:6px}
.cls-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:#0a1026;margin-bottom:8px}
.swatch{width:30px;height:42px;flex:none;clip-path:polygon(15% 0,85% 0,100% 10%,100% 85%,50% 100%,0 85%,0 10%)}
.cls-item .nm{flex:1;min-width:0}.cls-item .nm b{display:block}.cls-item .nm small{color:var(--mut)}
.cls-item select{width:auto;padding:5px 6px;font-size:13px}
.arena{position:relative;border-radius:20px;border:1px solid var(--line);overflow:hidden;min-height:540px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px 20px;background:repeating-linear-gradient(90deg,#0b3d1f 0 60px,#0e4a25 60px 120px)}
.arena::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,225,255,.25),transparent 55%),linear-gradient(180deg,rgba(6,10,24,.5),rgba(6,10,24,.88))}
.arena::after{content:'';position:absolute;left:50%;top:50%;width:300px;height:300px;border:2px solid rgba(255,255,255,.08);border-radius:50%;transform:translate(-50%,-50%)}
.arena>*{position:relative;z-index:1}
.pool-badge{background:rgba(0,0,0,.45);border:1px solid var(--line);padding:8px 18px;border-radius:30px;font-size:15px}
.pool-badge .ic{color:var(--acc);margin-right:6px}
.pool-badge b{color:var(--gold);font-size:20px}
.open-btn{font-size:22px;padding:14px 46px;border-radius:40px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,213,74,.6)}50%{box-shadow:0 0 0 16px rgba(255,213,74,0)}}
.key-hint{font-size:12px;color:var(--mut)}
.key-hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit}
/* PACK */
.pack{position:relative;width:200px;height:290px;border-radius:18px;background:var(--cbg);color:var(--cfg);box-shadow:0 0 40px var(--glow),inset 0 0 0 3px rgba(255,255,255,.35);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:18px 10px;overflow:hidden;cursor:pointer;animation:float 3s ease-in-out infinite;user-select:none}
.pack.big{width:240px;height:340px;font-size:18px}
.pack-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.5s infinite}
.pack-top{font-weight:800;letter-spacing:2px;font-size:14px;position:relative;display:flex;align-items:center}
.pack-top .ic{margin-right:6px;font-size:16px}
.pack-mid{text-align:center;position:relative}
.pack-x{font-size:56px;font-weight:800;line-height:1;text-shadow:0 3px 10px rgba(0,0,0,.3)}
.pack-lbl{font-size:20px;font-weight:600;margin-top:6px}
.pack-bot{font-weight:800;letter-spacing:3px;font-size:13px;position:relative;border-top:2px solid currentColor;padding-top:6px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.pack.charging{animation:shake .12s infinite;box-shadow:0 0 90px 10px var(--glow)}
.pack.charging2{--sc:1.12;animation:shake .05s infinite;box-shadow:0 0 180px 60px var(--glow)}
@keyframes shake{0%{transform:translate(-3px,2px) rotate(-2deg) scale(var(--sc,1))}50%{transform:translate(3px,-2px) rotate(2deg) scale(var(--sc,1))}100%{transform:translate(-2px,-3px) rotate(-1deg) scale(var(--sc,1))}}
/* CARD */
.fc-card{position:relative;width:15em;height:21.5em;background:var(--cbg);color:var(--cfg);clip-path:polygon(14% 0,86% 0,100% 9%,100% 86%,50% 100%,0 86%,0 9%)}
.fc-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 12%,rgba(255,255,255,.45),transparent 40%),repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 8px)}
.fc-card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 47%,transparent 58%);background-size:250% 100%;animation:shine 3s infinite;pointer-events:none;z-index:3}
.fc-top{position:absolute;top:2.1em;left:1.7em;text-align:center;line-height:1;z-index:2}
.fc-ovr{font-size:2.9em;font-weight:800}
.fc-pos{font-size:.95em;font-weight:600;margin-top:.3em}
.fc-g{font-size:1.4em;margin-top:.35em}
.fc-g .ic{stroke-width:2.6}
.fc-ava{position:absolute;top:1.3em;right:.9em;width:9.8em;height:10.1em;z-index:1}
.fc-ava svg{width:100%;height:100%;filter:drop-shadow(0 .25em .35em rgba(0,0,0,.35))}
.fc-namew{position:absolute;top:11.4em;left:1.3em;right:1.3em;text-align:center;border-bottom:1px solid currentColor;padding-bottom:.2em;z-index:2}
.fc-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-stats{position:absolute;top:13.8em;left:2.3em;right:2.1em;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:.15em 1em;z-index:2}
.fc-stats div{font-size:.92em;white-space:nowrap}
.fc-stats b{font-weight:800;margin-right:.3em}
.fc-bot{position:absolute;top:18.3em;left:0;right:0;text-align:center;z-index:2}
.fc-bot span{font-size:.85em;font-weight:600;letter-spacing:.5px}
.fc-back-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;letter-spacing:2px;z-index:2}
.fc-back-in .q{font-size:5em;line-height:1.1;filter:drop-shadow(0 0 .15em rgba(255,255,255,.7))}
.fc-back-in .q .ic{stroke-width:2.8}
.fc-back-in small{font-size:.9em;margin-top:.3em}
/* OVERLAY */
#ov{position:fixed;inset:0;z-index:100;display:none;background:radial-gradient(circle at center,#121c4a 0%,#03050d 70%);overflow:auto}
#ov.show{display:block}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:70px 16px 40px;position:relative}
.rays{position:fixed;left:50%;top:50%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,var(--g) 0deg 5deg,transparent 5deg 16deg);opacity:.22;animation:spin 18s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0%,transparent 45%);mask-image:radial-gradient(circle,#000 0%,transparent 45%);pointer-events:none;z-index:0}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ov-ctrl{position:fixed;top:14px;right:14px;z-index:6;display:flex;gap:8px}
.walk{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.charge-txt{margin-top:40px;font-size:20px;letter-spacing:3px;color:var(--mut);animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.3}}
.walk-item{animation:walkIn .6s cubic-bezier(.2,1.5,.4,1) both}
.wi-l{font-size:clamp(18px,3vw,28px);color:var(--mut);letter-spacing:6px}
.wi-i{font-size:clamp(64px,12vw,115px);line-height:1.3;color:#fff;filter:drop-shadow(0 0 25px var(--g))}
.wi-i .ic{stroke-width:1.6}
.wi-v{font-size:clamp(50px,10vw,110px);font-weight:800;line-height:1.1;text-shadow:0 0 30px var(--g),0 0 70px var(--g)}
@keyframes walkIn{from{opacity:0;transform:scale(2.6);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.card-reveal{font-size:clamp(12px,2.5vh,20px);filter:drop-shadow(0 0 35px var(--g));animation:cardIn 1.1s cubic-bezier(.2,.9,.3,1) both}
@keyframes cardIn{0%{transform:perspective(800px) rotateY(720deg) scale(.1);opacity:0}70%{transform:perspective(800px) rotateY(-12deg) scale(1.08);opacity:1}100%{transform:none}}
.reveal-title{margin-top:20px;font-size:clamp(24px,4.5vw,42px);font-weight:800;animation:walkIn .6s .7s both;text-shadow:0 0 25px var(--g)}
.reveal-title .ic{color:var(--gold);margin-right:10px}
.reveal-sub{color:var(--mut);font-size:18px;animation:walkIn .6s .9s both}
.act{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;animation:walkIn .5s 1s both}
.multi{position:relative;z-index:1;width:100%;max-width:1300px;text-align:center}
.multi-title{font-size:clamp(22px,4vw,34px);font-weight:800}
.multi-title .ic{color:var(--gold);margin-right:10px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:1.6em;margin:24px 0}
.flip{width:15em;height:21.5em;perspective:1200px;cursor:pointer;position:relative;animation:dealIn .55s both}
.flip::before{content:'';position:absolute;inset:-1.2em;background:radial-gradient(closest-side,var(--glow),transparent);opacity:.45;filter:blur(8px)}
.flip-in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip:not(.flipped):hover .flip-in{transform:translateY(-8px)}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.flip-name{position:absolute;left:-1em;right:-1em;top:calc(100% + .5em);font-weight:700;font-size:1.15em;opacity:0;transition:.4s .5s}
.flip.flipped .flip-name{opacity:1}
.grid .flip{margin-bottom:2.2em}
@keyframes dealIn{from{opacity:0;transform:translateY(-60vh) rotate(-25deg)}to{opacity:1;transform:none}}
#flashEl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
#flashEl.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:4;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(900deg)}}
/* HISTORY / MODAL / TOAST */
.hist-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist-item time{color:var(--mut);font-size:12px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);margin:4px 4px 0 0;font-size:13px}
#listModal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
#listModal.show{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:820px;width:100%;max-height:85vh;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head b .ic{color:var(--acc);margin-right:8px}
.modal-body{overflow:auto;padding:0 18px 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-weight:400}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#3a1a24;color:#ff9db0}
.tag.ok{background:#0f3324;color:#7dffcf}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:#111a3d;border:1px solid var(--acc);padding:10px 18px;border-radius:12px;transition:.3s;z-index:300;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast .ic{margin-right:8px;font-size:18px}
#toast.ok .ic{color:#3ee08f}#toast.err .ic{color:#ff5c7a}#toast.warn .ic{color:var(--gold)}#toast.info .ic{color:var(--acc)}
</style>
</head>
<body>

<header>
  <div class="logo"><i data-ic="futbol"></i><span>KR Random</span></div>
  <button class="btn sm" id="btnList"><i data-ic="list"></i>รายชื่อ</button>
  <button class="btn sm" id="btnSound"></button>
</header>

<div class="layout">
  <aside>
    <div class="box">
      <h3><i data-ic="fileImport" class="hi"></i>ข้อมูลนักเรียน</h3>
      <label class="file-drop" id="drop">
        <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
        <div class="big-ic"><i data-ic="sheet"></i></div>
        <div>คลิกหรือลากไฟล์ Excel มาวาง</div>
        <div class="hint">คอลัมน์: เลขที่ · ชื่อ-นามสกุล · ชั้น · เพศ</div>
      </label>
      <div class="btn-row">
        <button class="btn sm" id="btnTpl"><i data-ic="download"></i>แม่แบบ Excel</button>
        <button class="btn sm" id="btnDefault"><i data-ic="users"></i>รายชื่อห้องเรียน</button>
        <button class="btn sm" id="btnSample"><i data-ic="flask"></i>ข้อมูลตัวอย่าง</button>
        <button class="btn sm danger" id="btnClear"><i data-ic="trash"></i>ล้างข้อมูล</button>
      </div>
      <div id="stats" style="margin-top:12px"></div>
    </div>

    <div class="box">
      <h3><i data-ic="sliders" class="hi"></i>ตั้งค่าการสุ่ม</h3>
      <div class="field"><span class="lbl">ห้องที่จะสุ่ม</span><select id="selClass"></select></div>
      <div class="field">
        <div class="row2">
          <div><span class="lbl">เลขที่ตั้งแต่</span><input type="number" id="noFrom" placeholder="ทั้งหมด" min="1"></div>
          <div><span class="lbl">ถึง</span><input type="number" id="noTo" placeholder="ทั้งหมด" min="1"></div>
        </div>
        <div class="hint" id="noHint"></div>
      </div>
      <div class="field"><span class="lbl">เพศ</span>
        <div class="seg" id="segGender">
          <button data-v="all"><i data-ic="users"></i>ทั้งหมด</button>
          <button data-v="ชาย"><i data-ic="mars"></i>ชาย</button>
          <button data-v="หญิง"><i data-ic="venus"></i>หญิง</button>
        </div>
      </div>
      <div class="field"><span class="lbl">จำนวนคนต่อการเปิด 1 แพ็ค</span>
        <div class="stepper"><button id="cMinus"><i data-ic="minus"></i></button><input type="number" id="cnt" min="1" max="30"><button id="cPlus"><i data-ic="plus"></i></button></div>
      </div>
      <div class="field"><span class="lbl">คนที่ถูกสุ่มแล้ว</span>
        <div class="seg" id="segMode">
          <button data-v="exclude"><i data-ic="userX"></i>คัดออก</button>
          <button data-v="repeat"><i data-ic="repeat"></i>นับซ้ำได้</button>
        </div>
      </div>
      <button class="btn sm" id="btnReset" style="width:100%"><i data-ic="rotate"></i>คืนรายชื่อที่ถูกคัดออกทั้งหมด</button>
    </div>

    <div class="box">
      <h3><i data-ic="layers" class="hi"></i>การ์ดประจำห้อง</h3>
      <div id="themeList"></div>
    </div>
  </aside>

  <main>
    <div class="arena">
      <div class="pool-badge"><i data-ic="users"></i>พร้อมสุ่ม <b id="poolN">0</b> คน</div>
      <div id="packSlot"></div>
      <button class="btn gold open-btn" id="btnOpen"><i data-ic="box"></i>เปิดแพ็ค!</button>
      <div class="key-hint">กด <kbd>Space</kbd> เพื่อเปิดแพ็คได้ทันที</div>
    </div>
    <div class="box" style="margin-top:16px">
      <h3 style="display:flex;justify-content:space-between;align-items:center"><span><i data-ic="history" class="hi"></i>ประวัติการสุ่ม</span><button class="btn sm" id="btnClearHist"><i data-ic="eraser"></i>ล้างประวัติ</button></h3>
      <div id="history"></div>
    </div>
  </main>
</div>

<div id="ov">
  <div id="stage"></div>
  <div class="ov-ctrl">
    <button class="btn" id="skipBtn"><i data-ic="skip"></i>ข้าม</button>
    <button class="btn" id="closeBtn"><i data-ic="x"></i>ปิด</button>
  </div>
  <div id="flashEl"></div>
</div>

<div id="listModal">
  <div class="modal-box">
    <div class="modal-head"><b><i data-ic="list"></i><span id="listTitle">รายชื่อ</span></b><button class="btn sm" id="listClose"><i data-ic="x" class="m0"></i></button></div>
    <div class="modal-body" id="listBody"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ================= SVG ICONS (ฝังในไฟล์) ================= */
const ICONS={

const classes=()=>[...new Set(S.students.map(s=>s.cls))].sort((a,b)=>a.localeCompare(b,'th',{numeric:true}));
function ensureThemes(){const k=Object.keys(THEMES);classes().forEach((c,i)=>{if(!THEMES[S.themes[c]])S.themes[c]=k[i%k.length]})}

function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function sample(arr,k){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}
function hash(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function statsOf(s){const r=mulberry(hash(s.id));const ovr=75+Math.floor(r()*25);return{ovr,st:STAT_NAMES.map(n=>({n,v:Math.min(99,Math.max(50,ovr-12+Math.floor(r()*22)))}))}}

/* ---------- gender / name ---------- */
function normGender(g,raw){
  const s=String(g||'').trim().toLowerCase().replace(/\s/g,'');
  if(/^(ชาย|ช|ด\.?ช\.?|เด็กชาย|นาย|m|male|boy|man)$/.test(s))return'ชาย';
  if(/^(หญิง|ญ|ด\.?ญ\.?|เด็กหญิง|นางสาว|น\.?ส\.?|นาง|f|female|girl|woman)$/.test(s))return'หญิง';
  const n=String(raw||'').trim();
  if(/^(ด\.\s?ช\.|เด็กชาย|นาย|mr\.?|master)/i.test(n))return'ชาย';
  if(/^(ด\.\s?ญ\.|เด็กหญิง|นางสาว|น\.\s?ส\.|นาง|miss|mrs\.?|ms\.?)/i.test(n))return'หญิง';
  return'';
}
const stripPrefix=n=>String(n).trim().replace(/^(เด็กชาย|เด็กหญิง|ด\.\s?ช\.|ด\.\s?ญ\.|นางสาว|น\.\s?ส\.|นาย|นาง|mr\.|mrs\.|ms\.|miss)\s*/i,'').trim();

/* ---------- Excel parse ---------- */
function parseWB(wb){
  const out=[];
  wb.SheetNames.forEach(sn=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    const hi=aoa.findIndex((r,i)=>i<25&&r.some(c=>/ชื่อ|name/i.test(String(c))));
    if(hi<0)return;
    const head=aoa[hi].map(h=>String(h).toLowerCase().replace(/[\s.]/g,''));
    const find=(pats,ex=[])=>{for(const p of pats){const i=head.findIndex(h=>h.includes(p)&&!ex.some(x=>h.includes(x)));if(i>=0)return i}return -1};
    let nameI=find(['ชื่อ-นามสกุล','ชื่อนามสกุล','ชื่อ-สกุล','ชื่อสกุล','fullname']),full=nameI>=0;
    if(!full)nameI=find(['ชื่อ','name'],['ชื่อเล่น','nickname','lastname','surname','นามสกุล']);
    const surI=full?-1:find(['นามสกุล','สกุล','surname','lastname'],['ชื่อ-','ชื่อน','ชื่อส']);
    const prefI=find(['คำนำหน้า','prefix']);
    const levI=find(['ชั้น','ระดับ','grade','class']);
    const roomI=find(['ห้อง','room'],['ชั้น']);
    const noI=find(['เลขที่','no','number','ลำดับ'],['เลขประจำตัว','รหัส','id']);
    const genI=find(['เพศ','gender','sex']);
    const counter={};
    aoa.slice(hi+1).forEach(r=>{
      let name=String(r[nameI]??'').trim();if(!name)return;
      if(surI>=0&&surI!==nameI&&r[surI])name+=' '+String(r[surI]).trim();
      const pref=prefI>=0?String(r[prefI]).trim():'';
      const gender=normGender(genI>=0?r[genI]:'',pref+name);
      let lev=levI>=0?String(r[levI]).trim():'',room=roomI>=0&&roomI!==levI?String(r[roomI]).trim():'';
      let cls=lev&&room?(room.includes('/')?room:`${lev}/${room}`):(lev||room||sn);
      counter[cls]=(counter[cls]||0)+1;
      const no=parseInt(r[noI])||counter[cls];
      out.push(mk(cls,no,stripPrefix(name),gender));
    });
  });
  return out;
}
async function importFile(f){
  if(!f||!needXLSX())return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const list=parseWB(wb);
    if(!list.length){toast('ไม่พบรายชื่อ — ตรวจสอบว่ามีหัวคอลัมน์ "ชื่อ"','err');return}
    const replace=!S.students.length||confirm(`พบนักเรียน ${list.length} คน\n\nกด OK = แทนที่ข้อมูลเดิมทั้งหมด\nกด Cancel = เพิ่มต่อจากข้อมูลเดิม`);
    if(replace){S.students=list;S.drawn=[];S.history=[];S.set.cls='__all'}
    else{const ids=new Set(S.students.map(s=>s.id));list.forEach(s=>{if(!ids.has(s.id))S.students.push(s)})}
    ensureThemes();save();renderAll();
    toast(`นำเข้าสำเร็จ ${list.length} คน จาก ${new Set(list.map(s=>s.cls)).size} ห้อง`,'ok');
  }catch(e){console.error(e);toast('อ่านไฟล์ไม่สำเร็จ','err')}
}

/* ---------- render ---------- */
function getPool(){
  const st=S.set,dr=new Set(S.drawn);
  return S.students.filter(s=>(st.cls==='__all'||s.cls===st.cls)&&(st.from===''||s.no>=+st.from)&&(st.to===''||s.no<=+st.to)&&(st.gender==='all'||s.gender===st.gender)&&(st.mode!=='exclude'||!dr.has(s.id)));
}
function cardHTML(s){
  const t=themeOf(s),{ovr,st}=statsOf(s),L=s.name.length;
  const fs=L>24?.7:L>18?.82:L>13?.98:1.15;
  return`<div class="fc-card" style="--cbg:${t.bg};--cfg:${t.fg};--glow:${t.glow}">
   <div class="fc-top"><div class="fc-ovr">${ovr}</div><div class="fc-pos">No.${s.no}</div><div class="fc-g">${s.gender?I(gIconName(s.gender)):I('star')}</div></div>
   <div class="fc-ava">${avatar(s)}</div>
   <div class="fc-namew"><div class="fc-name" style="font-size:${fs}em">${esc(s.name)}</div></div>
   <div class="fc-stats">${st.map(x=>`<div><b>${x.v}</b>${x.n}</div>`).join('')}</div>
   <div class="fc-bot"><span>${esc(s.cls)} · ${t.name}</span></div></div>`;
}
function cardBack(s){const t=themeOf(s);return`<div class="fc-card" style="--cbg:${t.bg};--cfg:${t.fg}"><div class="fc-back-in"><div class="q">${I('question')}</div><div>KR RANDOM</div><small>${esc(s.cls)}</small></div></div>`}
function packHTML(key,label,n){const t=THEMES[key]||THEMES.icon;return`<div class="pack" style="--cbg:${t.bg};--cfg:${t.fg};--glow:${t.glow}"><div class="pack-shine"></div><div class="pack-top">${I('futbol')}KR RANDOM</div><div class="pack-mid"><div class="pack-x">×${n}</div><div class="pack-lbl">${esc(label)}</div></div><div class="pack-bot">STUDENT PACK</div></div>`}

function renderStats(){
  const s=S.students,dr=new Set(S.drawn);
  $('#stats').innerHTML=!s.length?'<div class="hint">ยังไม่มีรายชื่อ</div>':
  `<div class="stat">ทั้งหมด <b>${s.length} คน / ${classes().length} ห้อง</b></div>
   <div class="stat"><span>${I('mars','c-m')} ชาย / ${I('venus','c-f')} หญิง</span><b>${s.filter(x=>x.gender==='ชาย').length} / ${s.filter(x=>x.gender==='หญิง').length}</b></div>
   <div class="stat">ไม่ระบุเพศ <b>${s.filter(x=>!x.gender).length}</b></div>
   <div class="stat">ถูกคัดออกแล้ว <b>${s.filter(x=>dr.has(x.id)).length}</b></div>`;
}
function renderClassSelect(){
  const cs=classes();
  if(S.set.cls!=='__all'&&!cs.includes(S.set.cls))S.set.cls='__all';
  $('#selClass').innerHTML=`<option value="__all">ทุกห้อง (${S.students.length} คน)</option>`+cs.map(c=>`<option value="${esc(c)}">${esc(c)} (${S.students.filter(s=>s.cls===c).length} คน)</option>`).join('');
  $('#selClass').value=S.set.cls;
}
function renderThemes(){
  const cs=classes(),box=$('#themeList'),dr=new Set(S.drawn);
  if(!cs.length){box.innerHTML='<div class="hint">นำเข้ารายชื่อก่อน แล้วเลือกการ์ดให้แต่ละห้องได้ที่นี่</div>';return}
  box.innerHTML=cs.map(c=>{const t=THEMES[S.themes[c]],all=S.students.filter(s=>s.cls===c),d=all.filter(s=>dr.has(s.id)).length;
    return`<div class="cls-item"><div class="swatch" style="background:${t.bg}"></div><div class="nm"><b>${esc(c)}</b><small>${all.length} คน · สุ่มแล้ว ${d}</small></div>
    <select data-cls="${esc(c)}">${Object.entries(THEMES).map(([k,v])=>`<option value="${k}"${k===S.themes[c]?' selected':''}>${v.name}</option>`).join('')}</select></div>`}).join('');
  box.querySelectorAll('select').forEach(el=>el.onchange=()=>{S.themes[el.dataset.cls]=el.value;save();renderThemes();renderPack()});
}
function renderPool(){
  $('#poolN').textContent=getPool().length;
  const nos=S.students.filter(s=>S.set.cls==='__all'||s.cls===S.set.cls).map(s=>s.no);
  $('#noHint').textContent=nos.length?`เลขที่ในกลุ่มนี้: ${Math.min(...nos)} – ${Math.max(...nos)}`:'';
}
function renderPack(){
  const all=S.set.cls==='__all';
  $('#packSlot').innerHTML=packHTML(all?'icon':S.themes[S.set.cls],all?'ทุกห้อง':S.set.cls,S.set.count);
  $('#packSlot .pack').onclick=openPack;
}
function renderHistory(){
  $('#history').innerHTML=S.history.length?S.history.map(h=>`<div class="hist-item"><time>${new Date(h.t).toLocaleString('th-TH')} · ${h.mode==='exclude'?'คัดออก':'นับซ้ำ'}</time><div>${h.list.map(p=>`<span class="chip">${esc(p.cls)} #${p.no} ${esc(p.name)}</span>`).join('')}</div></div>`).join(''):'<div class="hint">ยังไม่มีประวัติ</div>';
}
function renderSettings(){
  $('#noFrom').value=S.set.from;$('#noTo').value=S.set.to;$('#cnt').value=S.set.count;
  document.querySelectorAll('#segGender button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.set.gender));
  document.querySelectorAll('#segMode button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.set.mode));
  $('#btnSound').innerHTML=S.sound?I('volOn')+'เสียง: เปิด':I('volOff')+'เสียง: ปิด';
}
function renderAll(){ensureThemes();renderStats();renderClassSelect();renderThemes();renderPool();renderPack();renderHistory();renderSettings()}

/* ---------- sound ---------- */
let AC;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,d,type='sine',v=.2,to,delay=0){if(!S.sound)return;try{const a=ac(),t0=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
function noise(d,v=.4){if(!S.sound)return;try{const a=ac(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),g=a.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(a.destination);s.start()}catch(e){}}
const rise=d=>{tone(110,d,'sawtooth',.07,880);tone(220,d,'triangle',.06,1760)};
const boom=()=>{noise(.6,.5);tone(90,.7,'sine',.6,30)};
const whoosh=()=>{noise(.25,.2);tone(300,.3,'triangle',.12,1200)};
const ding=()=>{tone(880,.4,'triangle',.2);tone(1320,.5,'triangle',.15,null,.08)};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.45,'square',.08,null,i*.12));

/* ---------- effects ---------- */
function flash(){const f=$('#flashEl');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function confetti(n=140){const cols=['#ffd54a','#00e1ff','#ff3cac','#7dffcf','#ffffff','#ff7b00'];for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.animationDuration=2+Math.random()*2.5+'s';c.style.animationDelay=Math.random()*.6+'s';c.style.transform=`rotate(${Math.random()*360}deg)`;$('#ov').appendChild(c);setTimeout(()=>c.remove(),5500)}}

/* ---------- draw flow ---------- */
let busy=false,runId=0,skipping=false,pend=[];
const sleep=ms=>skipping?Promise.resolve():new Promise(r=>{const t=setTimeout(r,ms);pend.push(()=>{clearTimeout(t);r()})});
function doSkip(){skipping=true;pend.forEach(f=>f());pend=[]}

async function openPack(){
  if(busy)return;
  if(!S.students.length){toast('กรุณานำเข้ารายชื่อนักเรียนก่อน','warn');return}
  const pool=getPool();
  if(!pool.length){toast(S.set.mode==='exclude'?'ไม่มีรายชื่อเหลือ — กด "คืนรายชื่อ" เพื่อเริ่มใหม่':'ไม่มีรายชื่อที่ตรงเงื่อนไข','warn');return}
  const want=Math.max(1,+S.set.count||1),picks=sample(pool,Math.min(want,pool.length));
  if(picks.length<want)toast(`เหลือเพียง ${pool.length} คน จึงสุ่มได้ ${picks.length} คน`,'info');
  if(S.set.mode==='exclude')picks.forEach(p=>{if(!S.drawn.includes(p.id))S.drawn.push(p.id)});
  S.history.unshift({t:Date.now(),mode:S.set.mode,list:picks.map(p=>({name:p.name,cls:p.cls,no:p.no}))});
  S.history=S.history.slice(0,50);save();

  busy=true;skipping=false;pend=[];const run=++runId;
  const best=picks.reduce((a,b)=>statsOf(b).ovr>statsOf(a).ovr?b:a);
  const stage=$('#stage');stage.style.setProperty('--g',themeOf(best).glow);
  const all=S.set.cls==='__all';
  stage.innerHTML=`<div class="rays"></div><div class="walk">${packHTML(all?'icon':S.themes[S.set.cls],all?'ทุกห้อง':S.set.cls,picks.length)}<div class="charge-txt">กำลังเปิดแพ็ค...</div></div>`;
  $('#ov').classList.add('show');$('#skipBtn').style.display='';
  const pack=stage.querySelector('.pack');pack.classList.add('big','charging');
  rise(2.4);
  await sleep(1200);if(run!==runId)return;
  pack.classList.add('charging2');
  await sleep(1200);if(run!==runId)return;
  flash();boom();
  if(picks.length===1)await walkout(picks[0],run);else multi(picks,run);
}

async function walkout(s,run){
  const stage=$('#stage');
  stage.innerHTML=`<div class="rays"></div><div class="walk" id="walk"></div>`;
  const walk=$('#walk');
  const steps=[['ห้องเรียน','school',s.cls],['เพศ',gIconName(s.gender),s.gender||'ไม่ระบุ'],['เลขที่','shirt',s.no]];
  for(const[l,ic,v]of steps){
    if(run!==runId)return;
    walk.innerHTML=`<div class="walk-item"><div class="wi-l">${l}</div><div class="wi-i">${I(ic)}</div><div class="wi-v">${esc(v)}</div></div>`;
    whoosh();await sleep(1500);
  }
  if(run!==runId)return;
  flash();boom();
  walk.innerHTML=`<div class="card-reveal">${cardHTML(s)}</div>
    <div class="reveal-title">${I('trophy')}${esc(s.name)}</div>
    <div class="reveal-sub">${esc(s.cls)} · เลขที่ ${s.no} ${s.gender?'· '+s.gender:''}</div>
    <div class="act"><button class="btn gold" id="again">${I('box')}เปิดแพ็คต่อ</button><button class="btn" id="done">${I('check')}เสร็จสิ้น</button></div>`;
  setTimeout(fanfare,300);confetti();
  $('#skipBtn').style.display='none';
  $('#again').onclick=()=>{closeOv();openPack()};$('#done').onclick=closeOv;
}

function multi(picks,run){
  const stage=$('#stage'),n=picks.length;
  const fs=n<=3?15:n<=6?12:n<=10?10:8;
  stage.innerHTML=`<div class="rays"></div><div class="multi">
    <div class="multi-title">${I('star')}ได้นักเรียน ${n} คน! แตะการ์ดเพื่อเปิด</div>
    <div class="grid" style="font-size:${fs}px">${picks.map((p,i)=>`<div class="flip" data-i="${i}" style="--glow:${themeOf(p).glow};animation-delay:${i*.09}s"><div class="flip-in"><div class="face back">${cardBack(p)}</div><div class="face front">${cardHTML(p)}</div></div><div class="flip-name">#${p.no} ${esc(p.name)}</div></div>`).join('')}</div>
    <div class="act"><button class="btn gold" id="flipAll">${I('sparkles')}เปิดทั้งหมด</button><button class="btn" id="again">${I('box')}เปิดแพ็คต่อ</button><button class="btn" id="done">${I('check')}เสร็จสิ้น</button></div></div>`;
  $('#skipBtn').style.display='none';
  const flips=[...stage.querySelectorAll('.flip')];
  const flipOne=f=>{if(f.classList.contains('flipped'))return;f.classList.add('flipped');ding();
    if(statsOf(picks[f.dataset.i]).ovr>=95)confetti(40);
    if(flips.every(x=>x.classList.contains('flipped'))){setTimeout(()=>{fanfare();confetti()},500)}};
  flips.forEach(f=>f.onclick=()=>flipOne(f));
  $('#flipAll').onclick=async()=>{for(const f of flips){if(run!==runId)return;if(!f.classList.contains('flipped')){flipOne(f);await new Promise(r=>setTimeout(r,380))}}};
  $('#again').onclick=()=>{closeOv();openPack()};$('#done').onclick=closeOv;
}
function closeOv(){runId++;doSkip();$('#ov').classList.remove('show');$('#stage').innerHTML='';document.querySelectorAll('.cf').forEach(c=>c.remove());busy=false;renderAll()}

/* ---------- list modal ---------- */
function openList(){
  const dr=new Set(S.drawn),cls=S.set.cls;
  const rows=S.students.filter(s=>cls==='__all'||s.cls===cls).sort((a,b)=>a.cls.localeCompare(b.cls,'th',{numeric:true})||a.no-b.no);
  $('#listTitle').textContent=`รายชื่อ ${cls==='__all'?'ทุกห้อง':cls} (${rows.length} คน)`;
  $('#listBody').innerHTML=rows.length?`<table><thead><tr><th>ห้อง</th><th>เลขที่</th><th>ชื่อ</th><th>เพศ</th><th>สถานะ</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.cls)}</td><td>${s.no}</td><td>${esc(s.name)}</td><td>${s.gender?`${I(gIconName(s.gender),s.gender==='ชาย'?'c-m':'c-f')} ${s.gender}`:'-'}</td><td>${dr.has(s.id)?'<span class="tag">คัดออกแล้ว</span>':'<span class="tag ok">รอสุ่ม</span>'}</td></tr>`).join('')}</tbody></table>`:'<p class="hint" style="padding:20px">ยังไม่มีข้อมูล</p>';
  $('#listModal').classList.add('show');
}

/* ---------- events ---------- */
$('#file').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};
const drop=$('#drop');
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>importFile(e.dataTransfer.files[0]));
$('#btnTpl').onclick=downloadTemplate;
$('#btnDefault').onclick=()=>{if(S.students.length&&!confirm('แทนที่ข้อมูลเดิมด้วยรายชื่อนักเรียนจากไฟล์ Excel?'))return;S.students=defaultStudents();S.drawn=[];S.history=[];S.set.cls='__all';ensureThemes();save();renderAll();toast(`โหลดรายชื่อ ${S.students.length} คน จาก ${classes().length} ห้องแล้ว`,'ok')};
$('#btnSample').onclick=()=>{if(S.students.length&&!confirm('แทนที่ข้อมูลเดิมด้วยข้อมูลตัวอย่าง?'))return;S.students=sampleData();S.drawn=[];S.history=[];S.set.cls='__all';save();renderAll();toast('โหลดข้อมูลตัวอย่าง 3 ห้องแล้ว','ok')};
$('#btnClear').onclick=()=>{if(!confirm('ลบรายชื่อ ประวัติ และการตั้งค่าการ์ดทั้งหมด?'))return;S.students=[];S.drawn=[];S.history=[];S.themes={};S.cleared=true;save();renderAll()};
$('#selClass').onchange=e=>{S.set.cls=e.target.value;S.set.from='';S.set.to='';save();renderAll()};
$('#noFrom').oninput=e=>{S.set.from=e.target.value.trim();save();renderPool()};
$('#noTo').oninput=e=>{S.set.to=e.target.value.trim();save();renderPool()};
document.querySelectorAll('#segGender button').forEach(b=>b.onclick=()=>{S.set.gender=b.dataset.v;save();renderSettings();renderPool()});
document.querySelectorAll('#segMode button').forEach(b=>b.onclick=()=>{S.set.mode=b.dataset.v;save();renderSettings();renderPool()});
const setCount=v=>{S.set.count=Math.max(1,Math.min(30,parseInt(v)||1));save();renderSettings();renderPack()};
$('#cMinus').onclick=()=>setCount(S.set.count-1);$('#cPlus').onclick=()=>setCount(S.set.count+1);$('#cnt').onchange=e=>setCount(e.target.value);
$('#btnReset').onclick=()=>{if(!S.drawn.length){toast('ยังไม่มีใครถูกคัดออก','info');return}if(confirm(`คืนรายชื่อ ${S.drawn.length} คนกลับเข้ากองสุ่ม?`)){S.drawn=[];save();renderAll();toast('คืนรายชื่อเรียบร้อย','ok')}};
$('#btnClearHist').onclick=()=>{if(confirm('ล้างประวัติการสุ่ม? (ไม่กระทบรายชื่อที่ถูกคัดออก)')){S.history=[];save();renderHistory()}};
$('#btnOpen').onclick=openPack;
$('#skipBtn').onclick=doSkip;$('#closeBtn').onclick=closeOv;
$('#btnSound').onclick=()=>{S.sound=!S.sound;save();renderSettings()};
$('#btnList').onclick=openList;$('#listClose').onclick=()=>$('#listModal').classList.remove('show');
$('#listModal').onclick=e=>{if(e.target.id==='listModal')e.currentTarget.classList.remove('show')};
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(e.code==='Space'){e.preventDefault();if(!$('#ov').classList.contains('show'))openPack();else doSkip()}
  if(e.code==='Escape'){if($('#ov').classList.contains('show'))closeOv();$('#listModal').classList.remove('show')}
});
if(!S.students.length&&!S.cleared){S.students=defaultStudents();S.drawn=[];S.history=[];try{save()}catch(e){}}
ensureThemes();
renderAll();
</script>
</body>
</html>
